[package]
name = "utils"
version = "0.1.0"
edition = "2024"
resolver = "2"

[lib]
name = "_utils"
crate-type = ["cdylib", "lib"]
path = "src-rust/lib.rs"

[dependencies]
itertools = "0.14.0"
ndarray = { version = "0.17.1", features = ["rayon"] }
numpy = "0.27"
pyo3 = "0.27"
rayon = "1.11.0"

[dev-dependencies]
ndarray = { version = "0.17.1", features = ["rayon", "approx"] }
approx = "0.5.1"
csv = "1.4.0"
serde = { version = "1.0.228", features = ["serde_derive"] }
criterion = { version = "0.8.1", features = ["html_reports"] }

[build-dependencies]
csv = "1.4.0"
serde = { version = "1.0.228", features = ["serde_derive"] }


[[bench]]
name = "benchmark"
harness = false
