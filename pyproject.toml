[build-system]
requires = ["setuptools", "setuptools-scm", "setuptools-rust>=1.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "site-calculation"
authors = [{ name = "ucgmsim" }]
description = "Site calculation models, including source-site distances and amplification models"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = ["numpy>=2", "pyfftw>=0.15.1", "scipy>=1.17.0"]

[tool.setuptools_scm]

[project.optional-dependencies]
test = ["hypothesis[numpy]>=6.151.0", "pytest>=9.0.2", "pytest-cov>=7.0.0"]
types = []

[dependency-groups]
dev = ["deptry", "ruff", "ty", "numpydoc"]


[tool.deptry]
pep621_dev_dependency_groups = ["test", "types"]

[tool.pytest]
markers = ["slow: mark a test as slow"]

[tool.setuptools.packages]
find = { where = [
  ".",
], include = [
  "site_calculation",
], exclude = [
  "wiki",
  "tests",
  "src-rust",
] }

[tool.ruff.lint]
extend-select = [
  # isort imports
  "I",
  # Use r'\s+' rather than '\s+'
  "W605",
  # All the naming errors, like using camel case for function names.
  "N",
  # Missing docstrings in classes, methods, and functions
  "D101",
  "D102",
  "D103",
  "D105",
  "D107",
  # Use f-string instead of a format call
  "UP032",
  # Standard library import is deprecated
  "UP035",
  # Missing function argument type-annotation
  "ANN001",
  # Using except without specifying an exception type to catch
  "BLE001",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = [
  "source_modelling",
  "workflow",
  "pygmt_helper",
  "qcore",
  "empirical",
  "nshmdb",
  "IM",
  "mera",
]

[tool.ruff.lint.per-file-ignores]
# Ignore no docstring in __init__.py
"__init__.py" = ["D104", "N999"]
# Ignore docstring errors in tests folder
"tests/**.py" = ["D"]
# Ignore the module name IM
"IM/__init__.py" = ["N999"]


[[tool.setuptools-rust.ext-modules]]
target = "site_calculation._utils"
binding = "PyO3"


[tool.numpydoc_validation]
checks = [
  "GL05",
  "GL08",
  "GL10",
  "PR01",
  "PR02",
  "PR03",
  "PR04",
  "PR05",
  "PR06",
  "PR07",
  "RT01",
  "RT02",
  "RT03",
  "RT04",
  "YD01",
]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "**/*.rs" },
]
